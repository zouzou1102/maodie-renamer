<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>主界面状态画廊 · C 面板阵列 — 耄耋改名</title>
<style>
/* ══════════════════════════════════════════════════════════════════════
   一、窗口的设计令牌 —— **照抄 C 方案原型 `C-面板阵列.html` 的 :root**，
       一个值都没有改。改这里的颜色就等于改设计稿，别做。
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#0B0A09;
  --raise:#211D1A;   /* 猫块 · 规则块 · 执行块 */
  --panel:#171413;   /* 文件表 · 控件区 */
  --sink:#070605;    /* 三张指标卡 */
  --hov:#26211D;
  --line:#2A2521; --line2:#3A342E;
  --ink:#F5F1EB; --ink2:#A69C90; --ink3:#9A8F82; --ink4:#8E8376;
  --ctl:#72665B;
  --acc:#FF7A1A; --acc-ink:#1C0D03; --sel:rgba(255,122,26,.13);
  --ok:#48B368; --warn:#D9A441; --bad:#F0604D;
  --cat:#F9C077; --cat-line:#B4712A;
  --hi:inset 0 1px 0 rgba(255,255,255,.065);
  --lo:inset 0 1px 3px rgba(0,0,0,.45);
  --sh1:0 1px 2px rgba(0,0,0,.45);
  --sh2:0 2px 4px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.35);
  --ui:"Segoe UI Variable Text","Segoe UI","Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --disp:"Bahnschrift","Segoe UI Variable Display","Segoe UI",var(--ui);
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --r:18px; --r-md:12px; --r-sm:8px;
}
html[data-theme="light"]{
  /* ★ 注意：这里**故意没有** --cat / --cat-line。
     猫身的橘色在两个主题下是同一套（与 C 原型一致）—— 不是漏写。 */
  --bg:#EDEBE7;
  --raise:#FFFFFF;
  --panel:#FAF8F5;
  --sink:#E3DFD8;
  --hov:#F2EEE9;
  --line:#E2DED6; --line2:#CBC4BA;
  --ink:#17150F; --ink2:#5B554E; --ink3:#68635A; --ink4:#6A6257; --ctl:#9C8E7B;
  --acc:#A1420D; --acc-ink:#FFFFFF; --sel:rgba(161,66,13,.10);
  --ok:#19713E; --warn:#A87A12; --bad:#C4322A;
  --hi:inset 0 1px 0 rgba(255,255,255,.95);
  --lo:inset 0 1px 3px rgba(24,20,16,.07);
  --sh1:0 1px 2px rgba(24,20,16,.08);
  --sh2:0 2px 4px rgba(24,20,16,.10),0 10px 24px rgba(24,20,16,.06);
}

/* ══════════════════════════════════════════════════════════════════════
   二、画廊自己的外壳（深色，与 C 原型的画板一致）
   ══════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;font-family:var(--ui);-webkit-font-smoothing:antialiased;color:#e8e6e3}
.galbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 26px;background:rgba(8,8,8,.96);border-bottom:1px solid #232323;backdrop-filter:blur(8px)}
.galbar__t{font-family:var(--disp);font-size:14px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:#fff}
.galbar__c{font-size:11.5px;color:#8a8a8a;font-family:var(--mono)}
.galbar__sp{margin-left:auto}
.seg{display:flex;align-items:center;gap:6px}
.seg__l{font-size:11px;color:#8a8a8a}
.seg button{font-family:var(--ui);font-size:12px;color:#cfcfcf;background:#1E1E1E;border:1px solid #363636;
  border-radius:7px;padding:5px 12px;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
.seg button:hover{border-color:#5a5a5a;color:#fff}
.seg button.on{background:#fff;color:#111;border-color:#fff}

.gal{padding:26px 26px 90px;display:flex;flex-direction:column;gap:30px;align-items:flex-start}
.intro{border:1px solid #2e2e2e;border-left:3px solid #FF7A1A;border-radius:10px;background:#141210;
  padding:16px 20px;font-size:13px;line-height:1.85;color:#c9c5c0;max-width:110ch}
.intro b{color:#ffc38a;font-weight:600}
.grp{font-family:var(--disp);font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:#9a9a9a;
  border-left:2px solid var(--acc);padding-left:10px;margin-top:14px}

/* 一块板 = 图 + 说明 */
.bd{display:flex;flex-direction:column;gap:10px}
.bd__hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bd__no{font-family:var(--mono);font-size:11px;font-weight:600;color:#111;background:#ffb066;
  border-radius:99px;padding:2px 9px;letter-spacing:.5px}
.bd__ti{font-size:14.5px;font-weight:600;color:#fff}
.bd__h{font-family:var(--mono);font-size:11px;color:#8a8a8a}
.bd__note{font-size:12.5px;color:#a8a8a8;line-height:1.7;max-width:118ch}
.bd__note b{color:#ffc38a;font-weight:600}
.bd__note code{font-family:var(--mono);font-size:11.5px;background:#1a1a1a;border:1px solid #2e2e2e;
  border-radius:4px;padding:1px 5px;color:#d8d2cc}
.bd__frame{position:relative;overflow:hidden}
.bd__inner{transform-origin:top left;position:relative}


/* ══════════════════════════════════════════════════════════════════════
   三、窗口本体 —— 同样照抄 C 原型的 `.win/.tbar/.grid/.p` 一整套
   ★ 2026-09-26 变更：窗口回到**固定 900px**（设计稿那种固定画布）。
     内容超出不再把窗口撑高，而是由 **G 格自己内部滚** 兜住 —— 这样每一屏
     都是一页装下，「开始改名」永远在右下角不动。
     （唯一例外：标着「本屏放开」的那一屏是故意把窗口摊开、只为看全 G 格。）
     代价：全窗口仍有两条滚动条（G 格 + 文件表），滚轮滚哪条取决于指针位置。
   ══════════════════════════════════════════════════════════════════════ */
.win{width:1440px;height:900px;background:var(--bg);color:var(--ink);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:0 40px 120px rgba(0,0,0,.78)}
.tbar{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:12px;padding:0 18px}
.brand{display:flex;align-items:center;gap:9px}
.brand__mark{width:24px;height:24px;display:block}
.brand__name{font-family:var(--disp);font-size:13.5px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.tbar__l{display:flex;align-items:center;gap:6px;margin-left:14px}
.tbar__c{margin-right:10px;font-size:11px;color:var(--ink3);font-family:var(--mono)}
.tbar__r{margin-left:auto;display:flex;align-items:center;gap:6px}
.tbtn{height:30px;padding:0 13px;border:1px solid var(--line);background:var(--panel);border-radius:99px;
  color:var(--ink3);font-family:var(--ui);font-size:11.5px;cursor:pointer}
.wkey{width:32px;height:30px;border:none;background:none;color:var(--ink3);font-size:12px;border-radius:var(--r-sm)}
.wkey--x:hover{background:var(--bad);color:#fff}

.grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(12,1fr);
  /* ★ 2026-09-26 变更：窗口改回**固定 900px**（设计稿的固定画布）。
     行 3/4 用 minmax(0,1fr) 吸收剩余空间并**受约束** —— 这样 G 格才会被压住、
     由它自己内部滚，而不是把窗口撑高。中间那两行就是干这个用的。 */
  grid-template-rows:auto auto minmax(0,1fr) minmax(0,1fr) auto;gap:12px;padding:0 14px 14px}
.p{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;
  display:flex;flex-direction:column;min-width:0;min-height:0}
.p--raise{background:var(--raise);border-color:var(--line2);box-shadow:var(--hi),var(--sh1)}
.p--sink{background:var(--sink);box-shadow:var(--lo)}
.pa{grid-column:1/5;grid-row:1/3;padding:20px 20px 18px;flex-direction:row;align-items:center;gap:20px}
.pb{grid-column:5/8;grid-row:1}
.pc{grid-column:8/11;grid-row:1}
.pd{grid-column:11/13;grid-row:1}
.pe{grid-column:5/13;grid-row:2;gap:12px}
.pf{grid-column:1/9;grid-row:3/6;padding:0;overflow:hidden}
.pg{grid-column:9/13;grid-row:3/5;gap:14px;min-height:0;overflow-y:auto;padding-right:14px}
/* 仅用于「G 格内容全览」那一屏：放开高度约束，把 G 格一次摊开看清楚 */
.win--full{height:auto;min-height:900px}
.win--full .pg{overflow:visible}
.ph{grid-column:9/13;grid-row:5;justify-content:center;gap:12px;
  border-color:color-mix(in srgb,var(--acc) 30%,var(--line2));box-shadow:var(--hi),var(--sh2)}
.lbl{font-family:var(--disp);font-size:9.5px;letter-spacing:1.7px;text-transform:uppercase;font-weight:600;color:var(--ink4)}
.bigno{font-family:var(--disp);font-size:60px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-1.5px;margin-top:auto}
/* ── A 猫块（照设计稿）—— 跨行 1-2、猫 224px、环 100px ──
   ★ 2026-09-26：原先这一列被拆成「行1 猫 / 行2 往里加东西」，猫被压到 112px、和设计稿差一半；
   那组按钮已整块搬进标题栏，猫块恢复设计稿尺寸。 */
.pa__hero{flex:0 0 240px;padding:8px;display:grid;place-items:center}
.pa__breathe .cat{width:224px;height:209px;display:block}
.pa__side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{position:relative;width:100px;height:100px}
.ring svg{width:100px;height:100px;display:block;transform:rotate(-90deg)}
/* ★ 2026-09-26 修：原来用 display:grid + place-items:center 居中「数字+说明」两行，
   但没给行高 → 两个隐式行被拉伸成各占半圆，数字被顶到上半圆（实测盒中心比圆心高 22.2px）。
   改成两个都绝对定位：数字钉在圆心，说明钉在圆心正下方 24px（该高度圆内还有 56px 净宽）。 */
.ring__tx{position:absolute;inset:0;text-align:center;pointer-events:none}
.ring__tx b{position:absolute;left:50%;top:50%;translate:-50% -50%;white-space:nowrap;
  font-family:var(--disp);font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.ring__tx span{position:absolute;left:50%;top:calc(50% + 24px);translate:-50% -50%;white-space:nowrap;
  font-size:9.5px;color:var(--ink3);letter-spacing:1px;
  /* letter-spacing 会在最后一个字后面多出 1px，让字看起来偏左 0.5px → 补回来 */
  padding-left:1px}
.pa__st{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.pa__st i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block}
.pa__s{font-size:11.5px;color:var(--ink3);margin-top:-6px;font-variant-numeric:tabular-nums;text-align:center}
/* ── B/C/D 分段条 ── */
.fbar{display:flex;gap:4px;margin-top:13px}
.fbar i{flex:1;height:7px;border-radius:3px;background:var(--line2);display:block}
.fbar i.on{background:var(--acc)}
.fbar i.hollow{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ctl)}
.fbar i.mut{background:var(--ink4);opacity:.32}
.fbar i.pick{background:var(--acc);box-shadow:0 0 0 2px var(--sink),0 0 0 3.5px var(--acc)}
.fbar i.bad{background:var(--bad)}
.fbarcap{margin-top:9px;font-size:11px;color:var(--ink2)}

/* ── E 规则块里的行 ── */
.pe__r{display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{position:relative;height:32px;padding:0 14px;border:1px solid var(--line);background:transparent;border-radius:99px;
  color:var(--ink3);font-family:var(--ui);font-size:12px;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.sentence{font-size:25px;font-weight:600;letter-spacing:-.2px;line-height:1.5;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sentence__lbl{font-family:var(--disp);font-size:9.5px;letter-spacing:1.7px;text-transform:uppercase;font-weight:600;
  color:var(--ink4);flex:0 0 auto}
.wd{padding:0 12px 2px;border-radius:var(--r-sm);background:var(--sel);color:var(--acc);
  border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}

/* 常用规则模板条（设计稿没画，按规格书 §3.3 补：chip 高 26px） */
.tpl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tpl__t{font-size:12px;font-weight:500;color:var(--ink3);flex:0 0 auto}
.tpl__row{display:flex;gap:6px;flex-wrap:wrap}
.tpl__chip{height:26px;padding:0 11px;border:1px solid var(--line);background:var(--panel);border-radius:9px;
  color:var(--ink2);font-family:var(--ui);font-size:11.5px;cursor:pointer}
/* 导入来源提示条 */
.srcbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r-sm);
  background:var(--sel);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);font-size:12px;color:var(--ink2)}
.srcbar__b{margin-left:auto;font-size:11.5px;color:var(--acc);background:none;border:1px solid var(--acc);
  border-radius:99px;padding:3px 10px;cursor:pointer}
/* 参数区：标签在左、控件在右（规格书 §4.2 铁律②） */
.form{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:11.5px;color:var(--ink3)}
.finput{height:34px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);
  color:var(--ink);font-family:var(--ui);font-size:12.5px;padding:0 10px;display:flex;align-items:center}
.finput--num{flex:0 0 56px;justify-content:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.finput--at{flex:0 0 64px;justify-content:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.finput--err{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 18%,transparent)}
.finput--mono{font-family:var(--mono)}
.fselect{height:34px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);
  color:var(--ink2);font-family:var(--ui);font-size:12.5px;padding:0 10px;display:flex;align-items:center;gap:8px;flex:1 1 auto}
.fselect--off{color:var(--ink3);opacity:.55}
.inline{display:flex;align-items:center;gap:8px}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.65}
.hint--err{color:var(--bad)}
.hint code{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line);
  border-radius:4px;padding:0 4px;color:var(--ink2)}
/* 勾选框 / 开关（照抄原型尺寸） */
.ckline{display:flex;align-items:center;gap:9px}
.ck{width:15px;height:15px;border:1.5px solid var(--ctl);border-radius:4px;display:inline-block;flex:0 0 auto;position:relative}
.ck.on{background:var(--acc);border-color:var(--acc)}
.ck.on::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border-right:2px solid var(--acc-ink);border-bottom:2px solid var(--acc-ink);transform:rotate(40deg)}
.ck__l{font-size:12.5px;color:var(--ink2)}
.sw{width:40px;height:23px;flex:0 0 auto;background:var(--ctl);border-radius:99px;position:relative;display:inline-block}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff}
.sw.on{background:var(--acc)}
.sw.on::after{transform:translateX(17px)}
/* 分组：标题 + 一条发丝线（规格书 §4.2 铁律④） */
.gsec{display:flex;align-items:center;gap:8px}
.gsec::after{content:"";flex:1;height:1px;background:var(--line)}
/* 规则块底栏 */
.rfoot{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.rfoot__n{font-size:11.5px;color:var(--ink3)}
.rfoot__btn{margin-left:auto;background:none;border:none;color:var(--ink3);font-family:var(--mono);
  font-size:11px;cursor:pointer;display:flex;align-items:center;gap:6px}
.rfoot__badge{font-family:var(--ui);font-size:10.5px;color:var(--acc);border:1px solid var(--acc);
  border-radius:99px;padding:1px 7px}

/* ── F 文件表（照抄原型） ── */
.pf__h{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line)}
.pf__h b{font-size:13px;font-weight:600}
.pf__h span{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.pf__h .r{margin-left:auto;display:flex;gap:6px}
.ht{height:30px;flex:0 0 30px;display:grid;grid-template-columns:34px 42px minmax(0,1fr) minmax(0,1fr) 72px;align-items:center;
  padding:0 20px;font-family:var(--disp);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;
  font-weight:600;color:var(--ink4);border-bottom:1px solid var(--line)}
.pf__body{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.tr{flex:0 0 46px;min-height:46px;display:grid;grid-template-columns:34px 42px minmax(0,1fr) minmax(0,1fr) 72px;
  align-items:center;padding:0 20px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink2)}
.tr.is-sel{background:var(--sel)}
.tr>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .no{font-family:var(--mono);font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ckcell{display:grid;place-items:center;overflow:visible}
.del{color:var(--ink3);text-decoration:line-through;text-decoration-thickness:2px}
.add{color:var(--acc);background:var(--sel);border-radius:4px;padding:1px 4px;font-weight:600}
.dim{color:var(--ink3)}
.st{font-family:var(--disp);font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:600;
  overflow:visible;text-overflow:clip}
.st--go{color:var(--acc)}.st--hold{color:var(--ink3)}.st--bad{color:var(--bad)}
.pf__ft{margin-top:auto;flex:0 0 54px;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--bg)}
.stack{flex:1;min-width:80px;display:flex;gap:3px;height:8px}
.stack i{display:block;border-radius:2px;background:var(--line2)}
.stack i.on{background:var(--acc)}.stack i.bad{background:var(--bad)}
.pf__lg{font-size:11px;color:var(--ink3);white-space:nowrap}
.pf__lg b{font-family:var(--mono);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.pf__more{flex:0 0 34px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink3);
  background:var(--bg);border-top:1px solid var(--line)}

/* ── G 序号 / 属性块 ── */
.row{display:flex;align-items:center;gap:8px}
.row__l{flex:0 0 38px;font-size:11.5px;color:var(--ink3)}
.inp{flex:1;min-width:0;height:34px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);
  color:var(--ink);font-family:var(--ui);font-size:12.5px;padding:0 10px;display:flex;align-items:center}
.inp--n{flex:0 0 56px;justify-content:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.sel{flex:1;min-width:0;height:34px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);
  color:var(--ink2);font-family:var(--ui);font-size:12.5px;padding:0 8px;display:flex;align-items:center}
.off{opacity:.45}
.vars{display:flex;gap:6px;flex-wrap:wrap}
.var{font-family:var(--mono);font-size:11.5px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:6px 10px;cursor:pointer}
.numadv__bar{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;background:none;border:1px solid var(--line);

  //   精确数字不必挤进圆圈 —— 三张统计卡和文件表底部的摘要条里都有；环只负责「一眼看出比例」。
  const frac = willChange + '/' + total;
  const ringNum = frac.length > 5 ? Math.round(pct * 100) + '%' : frac;
  const sub = big ? (big.total + ' 个文件 · 无重名')
    : (s.empty ? '还没有文件 · 拖进来就行' : (s.rows === 'clash' ? '6 个文件 · 1 处撞名' : '6 个文件 · 无重名'));
  const st  = s.empty ? '耄耋待命' : (s.rows === 'clash' ? '有名字撞上了' : '耄耋待命');
  return '<section class="p p--raise pa">'
    + '<div class="pa__hero"><div class="pa__breathe">'
    + '<svg class="cat" viewBox="0 0 120 112" aria-label="耄耋"><use href="#catfig"/><use href="#eyesfig"/></svg>'
    + '</div></div>'
    + '<div class="pa__side">'
    + '<div class="ring"><svg viewBox="0 0 100 100" aria-label="将变化 ' + frac + '，占 ' + Math.round(pct * 100) + '%">'
    + '<circle cx="50" cy="50" r="40" fill="none" stroke="var(--line)" stroke-width="6"/>'
    + '<circle cx="50" cy="50" r="40" fill="none" stroke="var(--acc)" stroke-width="6" stroke-linecap="round"'
    + ' stroke-dasharray="' + dash + ' ' + (C - dash).toFixed(1) + '"/></svg>'
    + '<div class="ring__tx"><b>' + ringNum + '</b><span>将变化</span></div></div>'
    + '<div class="pa__st"><i></i>' + st + '</div>'
    + '<div class="pa__s">' + sub + '</div>'
    + '</div></section>';
}

/* —— B/C/D 三张统计卡 —— */
function statsHTML(s) {
  const empty = !!s.empty, clash = s.rows === 'clash', big = s.big || null;
  const n = big ? {changed: big.changed, keep: big.total - big.changed, bad: 0}
    : {changed: empty ? 0 : (clash ? 4 : 5), keep: empty ? 0 : 1, bad: empty ? 0 : (clash ? 1 : 0)};
  // 分段条只有 6 格 —— 数字一大它就只能示意，精确比例看环里的百分比与卡上的数字
  const litB = big ? Math.round((n.changed / big.total) * 6) : n.changed;
  function card(cls, lbl, val, cap, bar) {
    return '<section class="p p--sink ' + cls + '"><div class="lbl">' + lbl + '</div>'
      + '<div class="bigno" data-count="' + val + '">' + (val < 10 ? '0' + val : val) + '</div>'
      + '<div class="fbar">' + bar + '</div>'
      + (cap ? '<div class="fbarcap">' + cap + '</div>' : '') + '</section>';
  }
  // B：将变化的 6 格
  let barB = '';
  for (let i = 0; i < 6; i++) barB += '<i class="' + (i < litB ? 'on' : 'hollow') + '"></i>';
  // C：无变化 —— 第 4 格圈住（大数字时「圈住一个」的说法不成立，全部画成灰格）
  let barC = '';
  for (let i = 0; i < 6; i++) barC += '<i class="' + (!big && i === 3 ? 'pick' : 'mut') + '"></i>';
  // D：撞名
  let barD = '';
  for (let i = 0; i < 6; i++) barD += '<i class="' + (i < n.bad ? 'bad' : '') + '"></i>';

  let h = '';
  h += card('pb', 'Will change / 将变化', n.changed, '', barB);
  h += card('pc', 'Keep / 无变化', n.keep, (!big && !empty) ? '被圈住的就是那一个 · 主图-04-备用.jpg' : '', barC);
  h += card('pd', 'Clash', n.bad,
    big ? '六格全通 · 没有一个撞名' : (clash ? '有 1 个名字和别人撞上了' : '六格全通 · 没有一个撞名'), barD);
  return h;
}

/* —— E 规则块 —— */
function ruleHTML(s) {
  const mode = s.mode || 'rule';
  let h = '<section class="p p--raise pe">';

  // ① 常用规则模板条（常显）
  h += '<div class="tpl"><span class="tpl__t">常用规则</span><div class="tpl__row">';
  TPL.forEach(function (t) { h += '<button class="tpl__chip">' + t + '</button>'; });
  h += '</div></div>';

  // ② 导入来源提示条（仅导入模式且确有导入项）
  if (mode === 'import' && s.imported) {
    h += '<div class="srcbar"><span>本批有 4 个名字来自「对照表.csv」，规则不影响它们</span>'
      + '<button class="srcbar__b">清除导入</button></div>';
  }

  // ③ 页签行（标签在左、五个页签在右）
  h += '<div class="pe__r"><span class="lbl">Rule / 规则</span><div class="tabs">';
  TABS.forEach(function (t) {
    h += '<button class="tab' + (t[0] === mode ? ' on' : '') + '">' + t[1] + '</button>';
  });
  h += '</div></div>';

  // ④ 一句话摘要
  h += '<p class="sentence"><span class="sentence__lbl">规则</span>';
  if (mode === 'replace') {
    h += '<span>把名字里所有的<span class="wd">广告</span>都换成<span class="wd">推广</span></span>';
  } else {
    h += '<span>' + esc(SENT[mode]) + '</span>';
  }
  h += '</p>';

  // ★ 参数区 / 改扩展名 / 区分大小写**不在这里**了 ——
  //   按要求挪到右下角 G 格（开咬改名上面），见 gcellHTML()。
  //   规则块从此只回答「改成什么」，不回答「怎么填」。

  // ⑧ 底栏：自动处理重名冲突 + 说明（管的是整条规则，不属于某个模式，留在这里）
  h += '<div class="rfoot">'
    + '<div class="ckline"><span class="sw"></span><span class="ck__l">自动处理重名冲突</span></div>'
    + '<span class="rfoot__n">关闭时冲突项会被跳过。无论开关如何，都「不会覆盖」任何已有文件。</span>'
    + '<button class="rfoot__btn">改动唯一真源就是这一句 · 改一个字下面那张表立刻重算</button>'
    + '</div>';

  // ⑨ 进阶设置入口（只在删除 / 替换 / 自定义出现）
  if (mode === 'delete' || mode === 'replace' || mode === 'rule') {
    h += '<div class="rfoot" style="margin-top:0;border-top:0;padding-top:0">'
      + '<button class="rfoot__btn">' + (s.regex ? '<span class="rfoot__badge">已启用 1 项</span>' : '')
      + '进阶设置 · 正则 / 大小写<span aria-hidden="true">›</span></button></div>';
  }

  h += '</section>';
  return h;
}

/* 各模式的参数区 */
function formHTML(s, mode) {
  if (mode === 'delete') {
    let h = '<span class="flabel">待删字符串</span>'
      + '<span class="finput' + (s.regexErr ? ' finput--err' : (s.regex ? ' finput--mono' : '')) + '">'
      + (s.regex ? '[0-9]+' : '广告') + '</span>';
    if (s.regexErr) h += '<span class="hint hint--err">正则写法有问题：Unmatched　「)」</span>';
    return h;
  }
  if (mode === 'replace') {
    return '<span class="flabel">查找</span><span class="finput">广告</span>'
      + '<span class="flabel">替换为</span><span class="finput">推广</span>';
  }
  if (mode === 'insert') {
    return '<div class="inline"><span class="flabel" style="flex:0 0 auto">在第</span>'
      + '<span class="finput finput--at">2</span>'
      + '<span class="flabel" style="flex:0 0 auto">个字符后插入</span>'
      + '<span class="finput">2026</span></div>'
      + '<p class="hint">数字超出名字长度时会自动放到末尾；填 0 等于加在最前面。插入的文字里<b>不认识变量</b>（<code>{n}</code>、<code>{d}</code> 会原样插进去）。</p>'
      + '<p class="hint">示例（拿「素材-01」这个名字试的，不是你列表里的文件）：素材-01 → 素材2026-01</p>';
  }
  if (mode === 'import') {
    let h = '<p class="hint">名字由表格决定，规则引擎不参与。</p>'
      + '<div><span class="tpl__chip" style="display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:99px;font-size:12.5px">'
      + (s.imported ? '重新选表格' : '选表格并导入…') + '</span></div>';
    if (s.imported) {
      h += '<p class="hint">已导入「对照表.csv」：4 个文件有名字</p>'
        + '<p class="hint">另外 2 个文件表里没有 —— 它们保持原名不动</p>';
    } else {
      h += '<p class="hint">导入模式：还没选表格 —— 这一步每一项都不会改名。</p>';
    }
    return h;
  }
  // 自定义
  return '<span class="flabel">前缀</span><span class="finput">{d}-</span>'
    + '<span class="flabel">后缀</span><span class="finput" style="color:var(--ink3)">加在扩展名之前</span>'
    + '<p class="hint">支持变量 <code>{n}</code> 序号、<code>{d}</code> 日期（<b>需先勾选下方对应开关</b>）、'
    + ATTRS.map(function (v) { return '<code>' + v + '</code>'; }).join('、')
    + '（<b>写上就生效，不用开关</b>）</p>';
}

/* —— F 文件表 —— */
function listHTML(s) {
  if (s.empty) {
    return '<section class="p pf"><div class="pf__h"><b>文件</b><span>共 0 项</span>'
      + '<div class="r"><button class="tab">只看将变化</button><button class="tab">全选</button></div></div>'
      + '<div class="ht"><span></span><span>No.</span><span>原本的名字</span><span>改完的名字</span><span>状态</span></div>'
      + '<div class="pf__body" style="align-items:center;justify-content:center;gap:10px">'
      + '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="var(--ink3)" stroke-width="1.4">'
      + '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'
      + '<div style="font-size:13px;font-weight:600">把文件拖进来，或者点左上角的「添加文件」</div>'
      + '<div style="font-size:11.5px;color:var(--ink3)">支持一次拖很多个，也支持整个文件夹</div>'
      + '</div>'
      + '<div class="pf__ft"><span class="lbl">改动摘要</span><div class="stack"><i></i><i></i></div>'
      + '<span class="pf__lg"><b>0</b> 将变化</span><span class="pf__lg"><b>0</b> 无变化</span>'
      + '<span class="pf__lg"><b>0</b> 撞名</span></div></section>';
  }

  const all = s.rows === 'clash' ? ROWS_CLASH : ROWS_OK;
  const shown = (s.onlyChanged ? all.filter(function (r) { return r.st[0] !== 'hold'; }) : all);
  const cnt = s.big ? s.big.total : (s.onlyChanged ? 5 : 6);

  let h = '<section class="p pf"><div class="pf__h"><b>文件</b><span>' + cnt + ' 项</span><div class="r">'
    + '<button class="tab' + (s.onlyChanged ? ' on' : '') + '">只看将变化</button>'
    + '<button class="tab">全选</button></div></div>'
    + '<div class="ht"><span></span><span>No.</span><span>原本的名字</span><span>改完的名字</span><span>状态</span></div>'
    + '<div class="pf__body">';

  shown.forEach(function (r, i) {
    h += '<div class="tr' + (r.sel && !s.onlyChanged ? ' is-sel' : '') + '">'
      + '<span class="ckcell"><span class="ck on"></span></span>'
      + '<span class="no">' + r.no + '</span>'
      + '<span>' + segHTML(r.a) + '</span>'
      + '<span>' + segHTML(r.b) + '</span>'
      + '<span class="st st--' + r.st[0] + '">' + r.st[1] + '</span></div>';
  });

  if (s.more) {
    const left = s.big ? (s.big.total - 6) : 494;
    const tot  = s.big ? s.big.total : 500;
    h += '<div class="pf__more">还有 ' + left + ' 项没显示（表里共 ' + tot + ' 项）</div>';
  }
  h += '</div>'      /* / .pf__body —— 文件行固定高、由这一层自己滚 */
    + '<div class="pf__ft"><span class="lbl">改动摘要</span>'
    + '<div class="stack"><i class="on" style="flex:' + (s.rows === 'clash' ? 4 : 5) + '"></i>'
    + '<i style="flex:1"></i>' + (s.rows === 'clash' ? '<i class="bad" style="flex:1"></i>' : '') + '</div>'
    + '<span class="pf__lg"><b>' + (s.rows === 'clash' ? 4 : 5) + '</b> 将变化</span>'
    + '<span class="pf__lg"><b>1</b> 无变化</span>'
    + '<span class="pf__lg"><b>' + (s.rows === 'clash' ? 1 : 0) + '</b> 撞名</span></div></section>';
  return h;
}
function segHTML(segs) {
  return segs.map(function (p) {
    if (p[1] === 1) return '<span class="del">' + esc(p[0]) + '</span>';
    if (p[1] === 2) return '<span class="add">' + esc(p[0]) + '</span>';
    if (p[1] === 3) return '<span class="dim">' + esc(p[0]) + '</span>';
    return esc(p[0]);
  }).join('');
}

/* —— G 格（开咬改名上面）：先「怎么操作」，再「序号 / 属性」 —— */
function gcellHTML(s) {
  const mode = s.mode || 'rule';
  const cond = !!s.seqOn;
  const kind = s.kind || 'number';
  const pos = s.pos || 'suffix';
  const off = cond ? '' : ' off';

  let h = '<section class="p pg">';

  // ① 当前模式的参数（从规则块挪来的）—— 五个模式都在这
  h += '<div class="form">' + formHTML(s, mode) + '</div>';

  // ② 改扩展名（五个模式都有；常显的勾，不进折叠）
  h += '<div class="form">'
    + '<div class="ckline"><span class="ck' + (s.extOn ? ' on' : '') + '"></span>'
    + '<span class="ck__l">改扩展名</span></div>';
  if (s.extOn) {
    h += '<div class="inline"><span class="fselect">' + EXTS[0] + '</span>'
      + '<span class="finput" style="flex:0 0 120px">pdf</span></div>';
  }
  h += '<p class="hint">与「全部小写」互不影响：扩展名按你写的样子来（写 <code>PDF</code> 就是 <code>.PDF</code>）。</p>'
    + '</div>';

  // ③ 区分大小写（仅删除 / 替换）
  if (mode === 'delete' || mode === 'replace') {
    h += '<div class="ckline"><span class="ck"></span><span class="ck__l">区分大小写</span></div>';
  }

  // ④ 序号 / 属性：只有「自定义」模式才有这两组
  if (mode === 'rule') {
  h += '<div class="gsec"><span class="lbl">序号</span></div>';
  h += '<div class="ckline"><span class="ck' + (cond ? ' on' : '') + '"></span>'
    + '<span class="ck__l">启用序号</span></div>';

  // 位置（第三档时就地长出 64px 数字框）
  h += '<div class="row"><span class="row__l">位置</span>'
    + '<span class="sel' + off + '">' + POSITIONS.filter(function (p) { return p[0] === pos; })[0][1] + '</span>'
    + (pos === 'at' ? '<span class="inp inp--n" style="flex:0 0 64px">3</span>' : '') + '</div>';
  if (pos === 'at' && cond) {
    h += '<p class="hint">数字超出名字长度时，会自动放到末尾。</p>';
  }

  // 类型
  h += '<div class="row"><span class="row__l">类型</span>'
    + '<span class="sel' + off + '">' + KINDS.filter(function (k) { return k[0] === kind; })[0][1] + '</span></div>';

  // 参数（随类型）
  let prm = '';
  if (kind === 'number' || kind === 'letter') {
    prm += '<span class="row__l">起始</span><span class="inp inp--n' + off + '">1</span>'
      + '<span class="row__l" style="flex:0 0 32px">增量</span><span class="inp inp--n' + off + '">1</span>';
    if (kind === 'number') prm += '<span class="row__l" style="flex:0 0 32px">位数</span><span class="inp inp--n' + off + '">3</span>';
  } else if (kind === 'random') {
    prm += '<span class="row__l">长度</span><span class="inp inp--n' + off + '">6</span>'
      + '<span class="tpl__chip" style="display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:8px">换一批</span>';
  } else {
    prm += '<span class="row__l">起点</span><span class="inp' + off + '" style="flex:1">2026-09-26</span>';
  }
  h += '<div class="row">' + prm + '</div>';
  if (kind === 'time' && cond) {
    h += '<div class="row"><span class="row__l">格式</span><span class="sel' + off + '">' + DATES[2] + '</span></div>';
  }

  // 「示例 · 日期」折叠条
  h += '<button class="numadv__bar' + (s.numAdv ? ' numadv__bar--open' : '') + '">示例 · 日期</button>';
  if (s.numAdv) {
    if (cond) {
      const names = kind === 'time' ? ['2026年09月26日']
        : (kind === 'letter' ? ['A', 'B', 'C'] : (kind === 'random' ? ['a7Fk2P', 'q9Wm4Z', 'L3xT8b'] : ['001', '002', '003']));
      h += '<div class="demo"><p class="demo__t">示例（拿「素材」这个名字试的，不是你列表里的文件）</p>'
        + '<p class="demo__l">' + names.map(function (x) { return '<code>' + x + '</code>'; }).join(' · ') + '</p></div>';
    }
    h += '<div class="gsec" style="margin-top:2px"><span class="lbl">日期</span></div>'
      + '<div class="ckline"><span class="ck"></span><span class="ck__l">启用日期（取执行当天）</span></div>'
      + '<div class="row"><span class="row__l">日期格式</span><span class="sel off">' + DATES[0] + '</span></div>'
      + '<p class="hint">日期取的是你点「开始改名」那天；如果中途跨过了零点，需要重新预览一次。</p>';
  }

  // 属性组 —— ★ 2026-09-26：改成一条折叠（和「示例·日期」同款），
  //   目的是压掉 G 格里一半的常显高度，让这个格子不必滚那么远。
  h += '<button class="numadv__bar' + (s.attrAdv ? ' numadv__bar--open' : '') + '">属性 · 变量</button>';
  if (s.attrAdv) {
    h += '<div class="vars">' + ATTRS.map(function (v) { return '<span class="var">' + v + '</span>'; }).join('') + '</div>'
      + '<p class="hint">注：创建 / 修改日期用的是上面「日期格式」那一档 —— 改那里，三处一起变。</p>'
      + '<div class="row"><span class="row__l">大小</span><span class="sel">自动</span></div>';
  }

  }   // end if (mode === 'rule')
  h += '</section>';
  return h;
}

/* —— H 执行块 —— */
function goHTML(s) {
  const n = s.empty ? 0 : (s.rows === 'clash' ? 4 : 5);
  const disabled = s.empty || s.regexErr;
  const label = s.done ? ('已改名 ' + n + ' 个') : ('开咬改名 · ' + n + ' 个');
  const keys = s.regexErr
    ? '<span>Ctrl O 添加</span><span>Ctrl Z 撤销</span><span>先修好正则写法</span>'
    : '<span>Ctrl O 添加</span><span>Ctrl Z 撤销</span><span>Enter 开咬</span>';
  return '<section class="p p--raise ph' + (s.done ? ' done' : '') + '">'
    + '<button class="go' + (s.done ? ' done' : '') + '"'
    + (disabled ? ' style="opacity:.45"' : '') + '>'
    + '<span class="goico">'
    + '<svg class="ico--go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"'
    + ' stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="M12.5 6 18.5 12l-6 6"/></svg>'
    + '<svg class="ico--chk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"'
    + ' stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.6 4.5L19 7"/></svg>'
    + '</span><span>' + label + '</span></button>'
    + '<div class="ph__k">' + keys + '</div></section>';
}

/* —— 进阶设置弹窗 —— */
function modalHTML(s) {
  if (!s.advOpen) return '';
  let b = '<div class="switchrow"><span class="ck' + (s.regex ? ' on' : '') + '"></span>'
    + '<span class="ck__l">用正则匹配</span><button class="helpbtn">? 看不懂？</button></div>';
  if (s.regex) {
    b += '<p class="hint">用正则：你说「长什么样」，数字换了也认得出 —— 填 <code>\\d+</code>，一串数字不管几位都能找到。</p>'
      + '<div class="demo"><p class="demo__t">当场看看（拿这条示例名字试的，不是你列表里的文件）</p>'
      + '<p class="demo__l"><code>2026-08-01-报告.docx</code><span aria-hidden="true">→</span>'
      + '<code>2026-08-01-报告.docx</code></p></div>';
  } else {
    b += '<p class="hint">不用正则：你填什么就找一模一样的字 —— 填 <code>2026-08-01</code>，换个日期就找不着了。</p>';
  }
  b += '<div class="row"><span class="row__l">大小写</span><span class="sel">保持原样</span></div>';
  return '<div class="mask"><div class="modal">'
    + '<div class="modal__h"><span class="modal__t">进阶设置</span><button class="modal__x">✕</button></div>'
    + '<div class="modal__b">' + b + '</div></div></div>';
}

/* —— 整窗 —— */
function winHTML(s) {
  return '<div class="win' + (s.gFull ? ' win--full' : '') + '" data-mode="' + (s.mode || 'rule') + '">'
    + tbarHTML(s)
    + '<div class="grid">'
    + catHTML(s) + statsHTML(s) + ruleHTML(s) + listHTML(s) + gcellHTML(s) + goHTML(s)
    + '</div>'
    + modalHTML(s)
    + '</div>';
}

/* ══════════════════════════════════════════════════════════════════════
   七、装配
   ══════════════════════════════════════════════════════════════════════ */
const K = {zoom: 0.75};
let boards = [];

function build() {
  const gal = document.getElementById('gallery');
  let html = '<div class="intro">'
    + '<b>这一版的分工（2026-09-26 改）</b>：<b>RULE / 规则块</b>只回答「改成什么」—— '
    + '常用规则 + 五个模式页签 + 一句话摘要 + 进阶设置入口，不再放任何输入框；<br>'
    + '<b>右下角 G 格（开咬改名上面那格）</b>只回答「怎么操作」—— 从上到下是：'
    + '当前模式的参数 → 改扩展名 → 区分大小写 → 序号 → 示例·日期 → 属性（后三组只有「自定义」模式有）。<br>'
    + '参数从规则块挪走之后，规则块高度回到设计稿的量级（实测 233px）。'
    + '<b>窗口固定 900px，全部一页装下</b>，「开始改名」永远在右下角不动；'
    + 'G 格内容超出时<b>由它自己内部滚</b>（不撑高窗口），所以全窗口仍是两条滚动条：<b>G 格 + 文件表</b>。'
    + '「示例 · 日期」和「属性 · 变量」两条折叠平时都折起，就是为了让 G 格不必滚太远。'
    + '</div>';
  let n = 0;
  STATES.forEach(function (s) {
    if (s.g) { html += '<div class="grp">' + s.g + '</div>'; return; }
    n++;
    html += '<div class="bd"><div class="bd__hd">'
      + '<span class="bd__no">' + s.no + '</span>'
      + '<span class="bd__ti">' + s.t + '</span>'
      + '<span class="bd__h" data-h="' + n + '">…</span>'
      + '</div>'
      + '<div class="bd__note">' + s.n + '</div>'
      + '<div class="bd__frame"><div class="bd__inner">' + winHTML(s) + '</div></div>'
      + '</div>';
  });
  gal.innerHTML = html;
  document.getElementById('cnt').textContent = n + ' 屏 · 窗口 1440 × 900（内容高的会变高）';
  measure();
}
function measure() {
  const inners = document.querySelectorAll('.bd__inner');
  const frames = document.querySelectorAll('.bd__frame');
  const hs = document.querySelectorAll('[data-h]');
  inners.forEach(function (inner, i) {
    const win = inner.firstElementChild;
    const h = win.offsetHeight;
    frames[i].style.height = (h * K.zoom) + 'px';
    // 窗口固定 900；只有「G 格全览」那一屏故意放开，要单独标出来
    if (hs[i]) hs[i].textContent = h === 900
      ? '窗口高 900px（固定）'
      : '窗口高 ' + h + 'px（本屏放开，只为看全 G 格）';
  });
}
function setZoom(z) {
  K.zoom = z;
  document.querySelectorAll('.bd__inner').forEach(function (el) {
    el.style.transform = 'scale(' + z + ')';
  });
  measure();
}
function setTheme(t) {
  document.documentElement.dataset.theme = t;
}
document.querySelectorAll('[data-theme-btn]').forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll('[data-theme-btn]').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
    setTheme(b.dataset.themeBtn);
  };
});
document.querySelectorAll('[data-zoom-btn]').forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll('[data-zoom-btn]').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
    setZoom(parseFloat(b.dataset.zoomBtn));
  };
});
build();
setZoom(0.75);
</script>
</body>
</html>
