<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>方案 E · 一页一步 — 耄耋改名</title>
<style>
:root{
  --bg:#0A0A0B; --panel:#141416; --panel2:#1B1B1E; --hov:#232327;
  --line:#242428; --line2:#33333A;
  --ink:#F6F6F7; --ink2:#9C9CA4; --ink3:#6E6E77; --ink4:#4A4A52;
  --acc:#FF6B1A; --acc-ink:#1B0A02; --sel:rgba(255,107,26,.15);
  --cat:#F9C077; --cat-line:#B4712A;
  --ui:"Segoe UI Variable Text","Segoe UI","Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --disp:"Segoe UI Variable Display","Segoe UI","Noto Sans SC",var(--ui);
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
html[data-theme="light"]{
  --bg:#FCFCFC; --panel:#FFFFFF; --panel2:#F3F3F4; --hov:#EDEDEF;
  --line:#E9E9EC; --line2:#D6D6DA;
  --ink:#111113; --ink2:#5F5F68; --ink3:#8E8E96; --ink4:#B6B6BC;
  --acc:#D9500F; --acc-ink:#FFFFFF; --sel:rgba(217,80,15,.10);
  --cat:#F9C077; --cat-line:#C97E2E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;font-family:var(--ui);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;padding:20px 0 40px;gap:14px}
.pgbar{display:flex;align-items:center;gap:12px;color:#b9b9b9;font-size:12.5px}
.pgbar b{color:#fff;font-weight:600}
.pgbar .t{font-size:11px;color:#8a8a8a;border:1px solid #333;border-radius:99px;padding:3px 10px}
.pgbar button{font-family:var(--ui);font-size:12px;color:#cfcfcf;background:#1E1E1E;border:1px solid #363636;
  border-radius:7px;padding:5px 12px;cursor:pointer}
.pgbar button.on{background:#fff;color:#111;border-color:#fff}

.win{width:1440px;height:900px;background:var(--bg);color:var(--ink);border-radius:10px;overflow:hidden;
  display:flex;flex-direction:column;border:1px solid var(--line);box-shadow:0 40px 120px rgba(0,0,0,.75)}

/* ───── 顶栏（兼拖拽区）＋ 顶部进度线 ───── */
.tbar{position:relative;height:56px;flex:0 0 56px;display:flex;align-items:center;gap:14px;
  padding:0 10px 0 26px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand__mark{width:22px;height:21px;display:block}
.brand__name{font-size:12px;font-weight:600;letter-spacing:3.4px;color:var(--ink2)}
.tr{display:flex;align-items:center;gap:1px;margin-left:auto;flex:0 0 auto}
.steptxt{font-family:var(--mono);font-size:11.5px;color:var(--ink3);letter-spacing:.6px;margin-right:14px}
.steptxt b{color:var(--acc);font-weight:600}
.wkey{width:34px;height:28px;border:none;background:none;color:var(--ink3);font-size:12px;cursor:pointer;
  border-radius:5px;transition:background-color .15s var(--ease),color .15s var(--ease)}
.wkey:hover{background:var(--panel2);color:var(--ink)}
.wkey--x:hover{background:#C4322A;color:#fff}
.prog{position:absolute;left:0;bottom:0;height:2px;width:50%;background:var(--acc);
  transition:width .35s var(--ease)}
.prog__rest{position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--line)}

/* ───── 舞台 ───── */
.stage{flex:1;min-height:0;display:flex;flex-direction:column}
.scroller{flex:1;min-height:0;overflow-y:auto}
.col{width:720px;margin:0 auto;padding:96px 0 24px}

.stepno{display:flex;align-items:flex-end;gap:28px;margin-bottom:4px}
.stepno__d{font-family:var(--disp);font-size:112px;line-height:.82;font-weight:600;letter-spacing:-4px;
  color:transparent;-webkit-text-stroke:1.2px var(--ink4)}
@supports not (-webkit-text-stroke:1px red){ .stepno__d{color:var(--ink4)} }
.stepno__cat{width:88px;height:82px;display:block;margin-bottom:4px}

h1{font-family:var(--disp);font-size:44px;font-weight:300;letter-spacing:-.6px;line-height:1.16;color:var(--ink)}
.lede{margin-top:14px;font-size:15px;line-height:1.72;color:var(--ink2);max-width:44ch}

.rows{margin-top:36px}
.r{display:flex;align-items:center;height:68px;border-top:1px solid var(--line)}
.r:last-child{border-bottom:1px solid var(--line)}
.r__l{flex:0 0 216px;font-size:13.5px;color:var(--ink2);letter-spacing:.3px}
.r__c{margin-left:auto;display:flex;align-items:center;gap:10px}

.mini{display:flex;padding:3px;background:var(--panel);border:1px solid var(--line2);border-radius:999px}
.mini__i{height:28px;padding:0 16px;border:none;background:none;border-radius:999px;font:inherit;font-size:12.5px;
  color:var(--ink2);cursor:pointer;transition:background-color .16s var(--ease),color .16s var(--ease)}
.mini__i:hover{color:var(--ink)}
.mini__i.on{background:var(--acc);color:var(--acc-ink);font-weight:600}

.tin{height:36px;width:240px;padding:0 14px;background:var(--panel);border:1px solid var(--line2);
  border-radius:999px;font-family:var(--mono);font-size:13px;color:var(--ink);outline:none;
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.tin:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--sel)}

.sw2{width:44px;height:24px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;
  transition:background-color .2s var(--ease)}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.sw2.on{background:var(--acc)}
.sw2.on::after{transform:translateX(20px)}

.eg{display:flex;align-items:center;gap:12px;margin-top:28px}
.eg__lb{font-size:11px;color:var(--ink3);letter-spacing:1.6px}
.eg code{font-family:var(--mono);font-size:13.5px;color:var(--ink2);background:var(--panel);
  border:1px solid var(--line);border-radius:7px;padding:6px 11px}
.eg code.eg__n{color:var(--ink);border-color:var(--line2)}
.eg ins{text-decoration:none;color:var(--acc);font-weight:700}
.eg .ar{color:var(--ink4);font-size:15px}

/* ───── 底部悬浮胶囊 ───── */
.dockrow{flex:0 0 96px;display:flex;align-items:center;justify-content:center}
.pdock{height:58px;display:flex;align-items:center;gap:14px;padding:0 12px 0 22px;
  background:var(--panel);border:1px solid var(--line2);border-radius:999px;
  box-shadow:0 22px 60px rgba(0,0,0,.55)}
.pdots{display:flex;align-items:center;gap:7px}
.pdots i{width:7px;height:7px;border-radius:99px;background:var(--line2);
  transition:width .24s var(--ease),background-color .24s var(--ease)}
.pdots i.done{background:var(--ink4)}
.pdots i.on{width:22px;background:var(--acc)}
.pdiv{width:1px;height:26px;background:var(--line)}
.pbtn{height:40px;padding:0 22px;border:1px solid var(--line2);background:none;color:var(--ink2);
  font:inherit;font-size:13px;border-radius:999px;cursor:pointer;
  transition:background-color .16s var(--ease),color .16s var(--ease),transform .12s var(--ease)}
.pbtn:hover{background:var(--hov);color:var(--ink)}
.pbtn:active{transform:scale(.96)}
.pbtn--go{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600;padding:0 32px}
.pbtn--go:hover{filter:brightness(1.07);background:var(--acc);color:var(--acc-ink)}

.scroller::-webkit-scrollbar{width:10px}
.scroller::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:3px solid transparent;background-clip:content-box}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
<defs>
<filter id="fur" x="-25%" y="-25%" width="150%" height="150%">
  <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="11" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<g id="catfig">
  <g filter="url(#fur)">
    <path d="M26 46 L34 12 L54 34 Z" fill="var(--cat)"/>
    <path d="M94 46 L86 12 L66 34 Z" fill="var(--cat)"/>
    <circle cx="60" cy="62" r="36" fill="var(--cat)"/>
  </g>
  <path d="M33 41 L37 20 L49 33 Z" fill="#E9A96A" opacity=".65"/>
  <path d="M87 41 L83 20 L71 33 Z" fill="#E9A96A" opacity=".65"/>
  <ellipse cx="46" cy="57" rx="6.4" ry="7.4" fill="#33251C"/>
  <ellipse cx="74" cy="57" rx="6.4" ry="7.4" fill="#33251C"/>
  <circle cx="48.4" cy="54" r="2.1" fill="#fff" opacity=".92"/>
  <circle cx="76.4" cy="54" r="2.1" fill="#fff" opacity=".92"/>
  <path d="M60 68 l-4.6 -4.2 h9.2 z" fill="#D97B2A"/>
  <path d="M60 69 q-4.5 6.5 -9 1.5" stroke="#33251C" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M60 69 q4.5 6.5 9 1.5" stroke="#33251C" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="34" cy="71" rx="6" ry="3.4" fill="#E8734A" opacity=".38"/>
  <ellipse cx="86" cy="71" rx="6" ry="3.4" fill="#E8734A" opacity=".38"/>
  <path d="M28 62 h-14 M28 70 h-12 M92 62 h14 M92 70 h12" stroke="var(--cat-line)" stroke-width="1.8" stroke-linecap="round" opacity=".75"/>
  <path d="M60 27 q4 -7 10 -3" stroke="var(--cat-line)" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55"/>
</g>
</defs>
</svg>

<header class="pgbar">
  <b>方案 E · 一页一步</b>
  <span class="t">1440×900</span>
  <span class="t">深色 · 近黑 + 单橘 · 超大字重</span>
  <button id="t-dark" class="on">深色</button>
  <button id="t-light">浅色</button>
</header>

<div class="win">

  <div class="tbar">
    <span class="prog__rest"></span>
    <span class="prog"></span>
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 120 112"><use href="#catfig"/></svg>
      <span class="brand__name">耄耋改名</span>
    </div>
    <div class="tr">
      <span class="steptxt">第 <b>2</b> 步 / 共 4 步</span>
      <button class="wkey">—</button><button class="wkey">□</button><button class="wkey wkey--x">✕</button>
    </div>
  </div>

  <div class="stage">
    <div class="scroller">
      <div class="col">

        <div class="stepno">
          <span class="stepno__d">02</span>
          <svg class="stepno__cat" viewBox="0 0 120 112"><use href="#catfig"/></svg>
        </div>

        <h1>名字要怎么改？</h1>
        <p class="lede">选一种改法，下面立刻显示改完的样子。选错了随时退回上一步，不会有任何文件被动到。</p>

        <div class="rows">
          <div class="r">
            <span class="r__l">改法</span>
            <div class="r__c">
              <div class="mini">
                <button class="mini__i on">替换</button>
                <button class="mini__i">插入</button>
                <button class="mini__i">删除</button>
                <button class="mini__i">只用编号</button>
              </div>
            </div>
          </div>
          <div class="r">
            <span class="r__l">找什么</span>
            <div class="r__c"><input class="tin" value="IMG_" spellcheck="false"></div>
          </div>
          <div class="r">
            <span class="r__l">换成什么</span>
            <div class="r__c"><input class="tin" value="旅行_" spellcheck="false"></div>
          </div>
          <div class="r">
            <span class="r__l">保持扩展名不动</span>
            <div class="r__c"><div class="sw2 on"></div></div>
          </div>
        </div>

        <div class="eg">
          <span class="eg__lb">例</span>
          <code>IMG_2043.JPG</code>
          <span class="ar">→</span>
          <code class="eg__n"><ins>旅行_</ins>2043.JPG</code>
        </div>

      </div>
    </div>

    <div class="dockrow">
      <div class="pdock">
        <span class="pdots"><i class="done"></i><i class="on"></i><i></i><i></i></span>
        <span class="pdiv"></span>
        <button class="pbtn">上一步</button>
        <button class="pbtn pbtn--go">下一步</button>
      </div>
    </div>
  </div>

</div>

<script>
document.getElementById('t-dark').onclick=function(){set('dark',this)};
document.getElementById('t-light').onclick=function(){set('light',this)};
function set(v,el){document.documentElement.dataset.theme=v;
  document.querySelectorAll('.pgbar button').forEach(function(b){b.classList.remove('on')});el.classList.add('on')}
document.querySelectorAll('.mini__i').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.mini__i').forEach(function(x){x.classList.remove('on')});t.classList.add('on');
  });
});
document.querySelectorAll('.sw2,.sw').forEach(function(s){
  s.addEventListener('click',function(){s.classList.toggle('on')});
});
var p=0;
document.querySelector('.pbtn').onclick=function(){move(-1)};
document.querySelector('.pbtn--go').onclick=function(){move(1)};
function move(d){
  p=Math.max(0,Math.min(3,p+d));
  document.querySelector('.prog').style.width=((p+1)/4*100)+'%';
  document.querySelector('.steptxt').innerHTML='第 <b>'+(p+1)+'</b> 步 / 共 4 步';
  document.querySelectorAll('.pdots i').forEach(function(el,i){
    el.className = i<p ? 'done' : (i===p ? 'on' : '');
  });
}
function fit(){
  var w=document.querySelector('.win'),s=Math.min(1,(window.innerWidth-36)/1440);
  w.style.transformOrigin='top center';
  w.style.transform=s<1?'scale('+s+')':'none';
}
window.addEventListener('resize',fit);fit();
</script>
</body>
</html>
